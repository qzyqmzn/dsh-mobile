name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dsh-compatibility:
    name: Current DSH frontend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: mobile
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          path: dsh
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: node mobile/scripts/check-dsh-compatibility.mjs dsh --contract-only

  gateway:
    name: Gateway (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  funnel-host:
    name: Funnel host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: native/funnel-host/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: go test ./...
        working-directory: native/funnel-host
      - run: go vet ./...
        working-directory: native/funnel-host
      - run: npm run build:funnel-host
      - run: npm run check:funnel-licenses:full
      - run: git diff --exit-code -- bin/dsh-mobile-funnel-win32-x64.exe FUNNEL_THIRD_PARTY_LICENSES.txt

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and assemble
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-mobile-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
