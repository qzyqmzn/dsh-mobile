name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run check:release-tag

  package:
    name: Plugin package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: native/funnel-host/go.sum
      - run: npm ci
      - name: Test Funnel host
        run: |
          go test ./...
          go vet ./...
        working-directory: native/funnel-host
      - run: npm run build:funnel-host
      - run: npm run check:funnel-licenses:full
      - run: npm run verify
      - name: Pack plugin and release metadata
        run: |
          npm pack
          sha256sum dsh-mobile-*.tgz > dsh-mobile-plugin.sha256
          npm sbom --sbom-format cyclonedx > dsh-mobile-npm-sbom.cdx.json
          go version -m bin/dsh-mobile-funnel-win32-x64.exe > dsh-mobile-funnel-go-modules.txt
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            dsh-mobile-*.tgz
            dsh-mobile-plugin.sha256
            dsh-mobile-npm-sbom.cdx.json
            dsh-mobile-funnel-go-modules.txt
          if-no-files-found: error

  android:
    name: Android package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 DSH_ANDROID_KEYSTORE_PASSWORD DSH_ANDROID_KEY_ALIAS DSH_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Test and build signed Android package
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - name: Record Android runtime dependencies
        run: bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$GITHUB_WORKSPACE/dsh-mobile-android-${GITHUB_REF_NAME}-dependencies.txt"
        working-directory: apps/mobile/android
      - name: Verify Android signature
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          report="$RUNNER_TEMP/dsh-mobile-apksigner.txt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$report"
          node scripts/verify-android-signature.mjs < "$report"
      - name: Enforce Android package size
        run: |
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          maximum=$((40 * 1024 * 1024))
          actual="$(stat -c %s "$apk")"
          if [ "$actual" -gt "$maximum" ]; then
            echo "Android APK is $actual bytes; release limit is $maximum bytes." >&2
            exit 1
          fi
      - name: Name Android package
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dsh-mobile-android-${GITHUB_REF_NAME}.apk"
          sha256sum "dsh-mobile-android-${GITHUB_REF_NAME}.apk" > "dsh-mobile-android-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: |
            dsh-mobile-android-${{ github.ref_name }}.apk
            dsh-mobile-android-${{ github.ref_name }}.apk.sha256
            dsh-mobile-android-${{ github.ref_name }}-dependencies.txt
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: [package, android]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: release-assets
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -type f -name 'dsh-mobile-*.tgz' -print -quit)"
          test -n "$package"
          version="${GITHUB_REF_NAME#v}"
          published="$(npm view "dsh-mobile@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "dsh-mobile@$version is already published; leaving the immutable npm release unchanged."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish "$package" --provenance --access public
          else
            npm publish "$package" --provenance --access public
          fi

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contributor_note=""
          if [ "$GITHUB_REF_NAME" = "v0.3.2" ]; then
            contributor_note="Special thanks to @JackRushante for PR #16: the secure Android media bridge, image attachments, localization foundation, bounded extension requests, and Funnel lifecycle hardening. The contributor's four original commits are retained in the release history."
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes "$contributor_note" \
              --title "$GITHUB_REF_NAME"
          fi
